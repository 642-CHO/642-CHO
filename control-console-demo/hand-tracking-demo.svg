    <path d="M437 225L484 177L525 164L536 181L489 241L451 274"/>
    <path d="M451 274L429 343L399 382Z"/>
    <path d="M285 382L399 382L429 343L420 276L381 238L335 235L296 271L270 326Z"/>
  </g>
  <g fill="#ff8a3d" stroke="#fff4eb" stroke-width="2">
    <circle cx="285" cy="382" r="7"/><circle cx="270" cy="326" r="7"/><circle cx="276" cy="262" r="7"/><circle cx="265" cy="192" r="7"/><circle cx="274" cy="110" r="7"/>
    <circle cx="316" cy="172" r="7"/><circle cx="322" cy="78" r="7"/><circle cx="340" cy="36" r="7"/>
    <circle cx="361" cy="166" r="7"/><circle cx="374" cy="69" r="7"/><circle cx="394" cy="37" r="7"/>
    <circle cx="402" cy="180" r="7"/><circle cx="420" cy="99" r="7"/><circle cx="441" cy="74" r="7"/>
    <circle cx="437" cy="225" r="7"/><circle cx="484" cy="177" r="7"/><circle cx="525" cy="164" r="7"/>
    <circle cx="451" cy="274" r="7"/><circle cx="420" cy="276" r="7"/><circle cx="381" cy="238" r="7"/><circle cx="335" cy="235" r="7"/>
  </g>
  <g font-family="Bahnschrift, sans-serif" fill="#b9d8e8">
    <text x="30" y="42" font-size="18" letter-spacing="3">VISION FOLLOW / DEMO</text>
    <text x="30" y="70" font-size="13">21 LANDMARKS · 7 CONTROL CHANNELS</text>
