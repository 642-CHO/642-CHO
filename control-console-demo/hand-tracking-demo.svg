<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title description">
  <title id="title">手部关键点识别示意</title>
  <desc id="description">深蓝背景上的手掌轮廓、二十一处关键点和七路控制量示意。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2d5d79" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="440" fill="#071d2f"/>
  <rect width="760" height="440" fill="url(#grid)"/>
  <g fill="none" stroke="#34d5d2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M285 382L270 326L276 262L265 192L274 110L294 65L310 72L316 172"/>
